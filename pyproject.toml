[project]
name = "immich-dedup"
version = "0.1.0"
description = "Cross-user duplicate removal for Immich via the public API: match, review, transfer album membership, trash with undo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[project.scripts]
cross-user-dedup = "immich_dedup.cli:main"
cross-user-dedup-ui = "immich_dedup.web.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/immich_dedup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that need Docker (deselect with -m 'not integration', select with -m integration)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
